name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://the5collective.org
          PUBLIC_SHEETS_ENDPOINT: ${{ vars.PUBLIC_SHEETS_ENDPOINT || 'https://script.google.com/macros/s/AKfycbzhaTe--qRC-2SLm3ye6Qk8Hs-7ILbyMA5h6ZONwdamrsF7JQdRb0H1_p80WKTStSJZ0g/exec' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment

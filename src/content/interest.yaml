# Home page (/) during prelaunch. No header or footer: just the message and the form.
# Edit the text and fields; keep the structure. Each submission becomes a row in the
# Google Sheet tab named after `form.name` (see integrations/google-sheets/README.md).
interest:
  seo:
    title: The Upper Room Collective | For Those Called to Build
    description: Connect with a community of faith-driven founders, funders and builders, and stay up to date on what’s next.

  heading: For Those Called to Build the Extraordinary.
  lede: Connect with a community of faith-driven founders, funders and builders. Tell us a little about yourself and we’ll keep you up to date on what’s next.

  form:
    name: Interest
    submitLabel: Submit
    success:
      heading: Thank you.
      body: You’re connected. Watch your inbox for updates on what’s next.
    fields:
      - name: name
        label: Name
        type: text
        autocomplete: name
        required: true
      - name: email
        label: Email address
        type: email
        autocomplete: email
        required: true
        half: true
      - name: phone
        label: Phone
        type: tel
        autocomplete: tel
        required: true
        half: true
      - name: business
        label: Company name
        type: text
        autocomplete: organization
        required: true
        half: true
      - name: job_title
        label: What is your job title?
        type: text
        autocomplete: organization-title
        required: true
        half: true
      - name: website
        label: Website
        type: url
        autocomplete: url
        required: false
        half: true
      - name: linkedin
        label: LinkedIn
        type: url
        autocomplete: "off"
        required: true
        half: true
      - name: journey
        label: Where are you in your founder journey?
        type: select
        required: true
        options:
          - I’m exploring entrepreneurship and finding my next idea.
          - I have an idea or a problem I want to explore.
          - I’m testing an idea or building an early version.
          - I’ve launched and am growing a venture.
          - I’m joining as an operator, investor, or supporter of founders.
      - name: interests
        label: I would like…
        type: checkboxes
        required: true
        options:
          - To stay updated on all events
          - To join the Run Club
          - To be invited to the next Founder Masterclass
          - To sign up for the Founder Design Studio
          - Consulting services
      - name: building
        label: What are you building, exploring, or interested in backing?
        hint: In one or two sentences, share a venture, a problem, or a sector you’re interested in. If you’re funding or supporting founders, tell us what kinds of ventures or stages you’re looking for.
        type: textarea
        required: false
      - name: consent
        label: I agree to receive emails and updates from The Upper Room Collective. I can unsubscribe at any time. Read our [Privacy Policy](/privacy).
        type: consent
        required: true

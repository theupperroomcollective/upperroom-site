# Site-wide settings: name, navigation, footer.
# Edit text freely. Keep the structure (indentation and dashes) the same.
main:
  name: The Upper Room Collective
  # Prelaunch: other pages show just the logo (linking home), no nav or footer,
  # so nothing unfinished is discoverable. Set to false at launch.
  prelaunch: true
  tagline: For Those Called to Build the Extraordinary.
  description: A faith-driven accelerator ecosystem for the world’s next unicorn founders.
  email: tanya@the5collective.org

  # A nav item is either a link (label + href) or a dropdown (label + children).
  nav:
    - label: About
      href: /about
    - label: Experiences
      children:
        - label: Founder Run Club
          href: /run-club
        - label: Founder Masterclasses
          href: /masterclasses
        - label: Founder Design Studio
          href: /studio
    - label: Contact
      href: /contact

  navCta:
    label: Join the Collective
    href: /join

  footerGroups:
    - heading: Experiences
      links:
        - label: Founder Run Club
          href: /run-club
        - label: Founder Masterclasses
          href: /masterclasses
        - label: Founder Design Studio
          href: /studio
    - heading: The Collective
      links:
        - label: About
          href: /about
        - label: Join the Collective
          href: /join
        - label: Contact
          href: /contact

  legalLinks:
    - label: Privacy Policy
      href: /privacy
    - label: Terms of Use
      href: /terms

  footerScripture:
    text: Let Your Light So Shine.
    reference: Matthew 5:16
